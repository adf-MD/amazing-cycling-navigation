name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Verify pinned toolchain versions
        run: |
          set -eu
          expected_node="v24.18.0"
          expected_npm="11.16.0"
          actual_node="$(node --version)"
          actual_npm="$(npm --version)"
          echo "Resolved Node.js: ${actual_node} (expected ${expected_node})"
          echo "Resolved npm: ${actual_npm} (expected ${expected_npm})"
          if [ "${actual_node}" != "${expected_node}" ]; then
            echo "::error::Resolved Node.js ${actual_node}, expected ${expected_node}. Keep .nvmrc and this check in sync."
            exit 1
          fi
          if [ "${actual_npm}" != "${expected_npm}" ]; then
            echo "::error::Resolved npm ${actual_npm}, expected ${expected_npm}. Node ${expected_node}'s bundled npm has apparently changed; update this check deliberately."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Build
        env:
          APP_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke test
        run: npm run e2e

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
