name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Verify pinned toolchain versions
        run: |
          set -eu
          expected_node="v24.18.0"
          expected_npm="11.16.0"
          actual_node="$(node --version)"
          actual_npm="$(npm --version)"
          echo "Resolved Node.js: ${actual_node} (expected ${expected_node})"
          echo "Resolved npm: ${actual_npm} (expected ${expected_npm})"
          if [ "${actual_node}" != "${expected_node}" ]; then
            echo "::error::Resolved Node.js ${actual_node}, expected ${expected_node}. Keep .nvmrc and this check in sync."
            exit 1
          fi
          if [ "${actual_npm}" != "${expected_npm}" ]; then
            echo "::error::Resolved npm ${actual_npm}, expected ${expected_npm}. Node ${expected_node}'s bundled npm has apparently changed; update this check deliberately."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Build
        env:
          APP_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # Shards rather than a longer timeout: backlog item 116 kept the 20-minute
  # limit and asked for the suite to be optimised or sharded if it ever
  # approached it. Two shards since bac3553; four since item 133, when the
  # longer shard's job reached 15 min 56 s. The denominator appears in the
  # job name, the matrix and the --shard argument, and all three must agree.
  # fail-fast is off so that one shard failing never cancels another shard's
  # run and failure evidence. Deploy's `needs: e2e` waits for, and requires
  # success from, every shard.
  e2e:
    name: End-to-end tests (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Verify pinned toolchain versions
        run: |
          set -eu
          expected_node="v24.18.0"
          expected_npm="11.16.0"
          actual_node="$(node --version)"
          actual_npm="$(npm --version)"
          echo "Resolved Node.js: ${actual_node} (expected ${expected_node})"
          echo "Resolved npm: ${actual_npm} (expected ${expected_npm})"
          if [ "${actual_node}" != "${expected_node}" ]; then
            echo "::error::Resolved Node.js ${actual_node}, expected ${expected_node}. Keep .nvmrc and this check in sync."
            exit 1
          fi
          if [ "${actual_npm}" != "${expected_npm}" ]; then
            echo "::error::Resolved npm ${actual_npm}, expected ${expected_npm}. Node ${expected_node}'s bundled npm has apparently changed; update this check deliberately."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify Playwright package matches the pre-installed browser image
        run: |
          set -eu
          expected_playwright="1.61.1"
          actual_playwright="$(node -p "require('./node_modules/playwright-core/package.json').version")"
          echo "Resolved playwright-core: ${actual_playwright} (expected ${expected_playwright})"
          if [ "${actual_playwright}" != "${expected_playwright}" ]; then
            echo "::error::Resolved playwright-core ${actual_playwright}, expected ${expected_playwright}. The mcr.microsoft.com/playwright container image's tag AND digest in this workflow must both be bumped together to match package-lock.json whenever @playwright/test changes."
            exit 1
          fi

      - name: Build
        env:
          APP_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      # Backlog item 146: the list output in this log as before, plus
      # Playwright's built-in JSON report — per-test status, duration,
      # annotations and errors, and the worker count actually used. The
      # command-line --reporter overrides the config's `list` in CI only, so
      # local runs are unchanged. PLAYWRIGHT_JSON_OUTPUT_FILE is the output
      # setting the installed Playwright (1.61.1) supports; recheck it when
      # @playwright/test is upgraded. Without it the JSON would go to stdout,
      # mixed with the list output. The file is written outside test-results/,
      # so the failure evidence below is unchanged, and only when the run
      # ends: a run killed before then leaves no report.
      - name: End-to-end test suite
        id: e2e
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report/e2e-timing-shard-${{ matrix.shard }}.json
        run: npm run e2e -- --shard=${{ matrix.shard }}/4 --reporter=list,json

      # Backlog item 116. Playwright writes a trace, a screenshot and an
      # error context for a failed test only (see playwright.config.ts), and
      # the container's filesystem is discarded when the job ends — so
      # without this step a CI-only failure leaves nothing but reporter text,
      # which is exactly what made item 32 expensive to diagnose. Scoped to
      # the E2E step's own failure: failure() is false on cancellation, and
      # the conclusion check keeps an earlier step's failure (toolchain,
      # npm ci, build) from uploading an empty directory. if-no-files-found:
      # ignore so a missing directory can never mask the real test failure.
      # Only test-results/ is uploaded — never dist/, node_modules/ or the
      # repository root. No permissions are needed: upload-artifact uses the
      # Actions runtime token, not GITHUB_TOKEN.
      - name: Upload Playwright failure evidence
        if: ${{ failure() && steps.e2e.conclusion == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failures-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      # Backlog item 146: this shard's JSON report, kept for timing and status
      # comparisons. Uploaded when the test step itself finished, passed or
      # failed. Not on cancellation, a job timeout or an earlier step's
      # failure, since the report would be missing or meaningless; no artefact
      # is promised for every early termination, and if-no-files-found: warn
      # records a missing report instead of failing. continue-on-error keeps
      # an upload problem from changing the job's result or blocking Deploy:
      # the report is evidence, not part of the gate. Retrieving it, like the
      # failure evidence, needs an authenticated GitHub account.
      - name: Upload Playwright JSON timing report
        if: ${{ !cancelled() && (steps.e2e.conclusion == 'success' || steps.e2e.conclusion == 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-timing-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: playwright-report/e2e-timing-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 7

  deploy:
    name: Deploy
    needs: [verify, e2e]
    if: github.event_name != 'pull_request'
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
