<!doctype html>
<!--
  Item 102 — primary-navigation symbol mock-ups (design stage only).

  This page renders the real four-tab navigation with the app's own
  stylesheet (../../../src/index.css, linked live) and the app's own markup
  and class names, swapping only the 24-unit SVG artwork inside each tab.
  Nothing here is production code; see README.md in this directory.

  Query parameters (all optional):
    dir       current | a | b | c, or for the Planen refinement a-p1 | a-p2
              | sketch-*                                  (default: index page)
    selected  library | riding | planning | settings      (default: library)
    status    1 — with selected=settings, show the Status view (the Settings
              tab then carries aria-current="true", as in the app)
    lang      en | de                                     (default: en)
    text      100 | 200 — root font size in per cent      (default: 100)
    inset     simulated top safe-area inset in px         (default: 0)
    view      strip | context | specimen                  (default: strip)
    scroll    context view only: scroll offset in px      (default: 0)

  Classic inline scripts only, so the file also opens straight from disk.
-->
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Navigation symbols</title>
    <link rel="stylesheet" href="../../../src/index.css" />
    <style>
      /* Mock-up-only presentation: placeholder content and the specimen and
       * index views. Nothing here restyles the navigation itself. */
      .mock-line {
        height: 0.75rem;
        border-radius: 999px;
        background: var(--colour-border);
        opacity: 0.35;
      }
      .mock-line.short {
        width: 55%;
      }
      .mock-status-bar {
        position: fixed;
        inset: 0 0 auto 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      .mock-status-bar::after {
        content: "";
        width: 120px;
        height: 34px;
        margin-top: 6px;
        border-radius: 17px;
        background: #000;
      }
      .specimen {
        display: inline-grid;
        gap: 12px;
        padding: 16px;
        font-size: 0.8rem;
      }
      .specimen-row {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .specimen-tile {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius-sm);
        color: var(--colour-text);
      }
      .specimen-tile.is-selected {
        background: var(--colour-accent-soft);
        box-shadow: inset 0 0 0 2px var(--colour-accent);
        color: var(--colour-accent);
      }
      .specimen-caption {
        width: 4.5rem;
        color: var(--colour-text-muted);
      }
      .index {
        padding: 16px;
        display: grid;
        gap: 16px;
      }
      .index iframe {
        border: 1px solid var(--colour-border);
        background: var(--colour-bg);
      }
      .index-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
    </style>
  </head>

        },
        "sketch-heavy-dots": {
          name: "Sketch · current path, dotted at A's 2 px",
          icons: {
            library: {
              base: `<rect x="3" y="5" width="3.4" height="3.4" rx="0.8"/><rect x="3" y="10.3" width="3.4" height="3.4" rx="0.8"/><rect x="3" y="15.6" width="3.4" height="3.4" rx="0.8"/><g fill="none" stroke="currentColor" stroke-width="2.18" stroke-linecap="round" stroke-linejoin="round"><path d="M10.2 6.7H20.8M10.2 12H20.8M10.2 17.3H20.8"/></g>`,
            },
            riding: {
              base: `<g fill="none" stroke="currentColor" stroke-width="2.18" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.3" cy="15.9" r="3.8"/><circle cx="18.7" cy="15.9" r="3.8"/><path d="M5.3 15.9L9.6 9.2H15.4L18.7 15.9M9.6 9.2L12.6 15.9M15.4 9.2V5.9M13.9 5.9H16.9M9.6 9.2L9.1 6.4M7.7 6.4H10.3"/></g>`,
            },
            planning: {
              base: `<g fill="none" stroke="currentColor" stroke-width="2.18" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.01 3.7"><path d="M4 18L9 12L15 14L20 6"/></g><circle cx="4" cy="18" r="2.4"/><circle cx="20" cy="6" r="2.4"/>`,
            },
            settings: {
              base: `<g fill="none" stroke="currentColor" stroke-width="2.18" stroke-linecap="round" stroke-linejoin="round"><path d="M10.38 4.68L10.72 2.28A9.8 9.8 0 0 1 13.28 2.28L13.62 4.68A7.5 7.5 0 0 1 16.03 5.67L16.03 5.67L17.97 4.23A9.8 9.8 0 0 1 19.77 6.03L18.33 7.97A7.5 7.5 0 0 1 19.32 10.38L19.32 10.38L21.72 10.72A9.8 9.8 0 0 1 21.72 13.28L19.32 13.62A7.5 7.5 0 0 1 18.33 16.03L18.33 16.03L19.77 17.97A9.8 9.8 0 0 1 17.97 19.77L16.03 18.33A7.5 7.5 0 0 1 13.62 19.32L13.62 19.32L13.28 21.72A9.8 9.8 0 0 1 10.72 21.72L10.38 19.32A7.5 7.5 0 0 1 7.97 18.33L7.97 18.33L6.03 19.77A9.8 9.8 0 0 1 4.23 17.97L5.67 16.03A7.5 7.5 0 0 1 4.68 13.62L4.68 13.62L2.28 13.28A9.8 9.8 0 0 1 2.28 10.72L4.68 10.38A7.5 7.5 0 0 1 5.67 7.97L5.67 7.97L4.23 6.03A9.8 9.8 0 0 1 6.03 4.23L7.97 5.67A7.5 7.5 0 0 1 10.38 4.68Z"/><circle cx="12" cy="12" r="2.7"/></g>`,
            },
          },
        },
      };
      // ICONS:END

      const DESTINATIONS = ["library", "riding", "planning", "settings"];
      const COPY = {
        en: {
          htmlLang: "en-GB",
          navLabel: "Main",
          library: "Routes",
          riding: "Ride",
          planning: "Plan",
          settings: "Settings",
          status: "Status",
          switcherLabel: "Settings and Status",
          preferences: "Preferences",
          explanations: "Explanations",
          panels: ["Language", "Route planning", "OpenRouteService"],
          explanationPanels: ["Climbs and gradients", "Riding"],
        },
        de: {
          htmlLang: "de",
          navLabel: "Hauptbereiche",
          library: "Routen",
          riding: "Fahren",
          planning: "Planen",
          settings: "Einstellungen",
          status: "Status",
          switcherLabel: "Einstellungen und Status",
          preferences: "Optionen",
          explanations: "Erklärungen",
          panels: ["Sprache", "Routenplanung", "OpenRouteService"],
          explanationPanels: ["Anstiege und Streckenneigung", "Während der Fahrt"],
        },
      };

      const params = new URLSearchParams(location.search);
      const dirKey = params.get("dir");
      const selected = params.get("selected") ?? "library";
      const statusView = params.get("status") === "1";
      const lang = params.get("lang") === "de" ? "de" : "en";
      const copy = COPY[lang];
      const view = params.get("view") ?? "strip";
      const root = document.documentElement;

      /** The icon markup for one destination, mirroring NavIcon.tsx's
       * <svg aria-hidden focusable=false width=22 height=22 viewBox=0 0 24 24
       * fill=currentColor style="display:block;flex-shrink:0">. */
      function svg(dir, destination, isSelected, sizePx = 22) {
        const icon = DIRECTIONS[dir].icons[destination];
        const inner = isSelected && icon.selected ? icon.selected : icon.base;
        return (
          `<svg aria-hidden="true" focusable="false" width="${sizePx}" height="${sizePx}" ` +
          `viewBox="0 0 24 24" fill="currentColor" style="display:block;flex-shrink:0">${inner}</svg>`
        );
      }

      function navCurrent(destination) {
        if (destination === "settings" && selected === "settings" && statusView)
          return "true";
        return destination === selected ? "page" : null;
      }

      function navigation(dir) {
        const buttons = DESTINATIONS.map((destination) => {
          const current = navCurrent(destination);
          return (
            `<button type="button" class="main-nav-button" data-destination="${destination}"` +
            (current ? ` aria-current="${current}"` : "") +
            `>${svg(dir, destination, current !== null)}<span>${copy[destination]}</span></button>`
          );
        }).join("");
        return `<nav aria-label="${copy.navLabel}" class="main-nav">${buttons}</nav>`;
      }

      function panels(titles) {
        return titles
          .map(
            (title) =>
              `<section class="panel stack">${title ? `<h3>${title}</h3>` : ""}` +
              `<div class="mock-line"></div>`.repeat(view === "context" ? 5 : 2) +
              `<div class="mock-line short"></div></section>`,
          )
          .join("");
      }

      function content() {
        if (selected === "settings") {
          const switcher = ["settings", "status"]
            .map((v) => {
              const isCurrent = (v === "status") === statusView;
              return (
                `<button type="button" class="settings-status-switcher-button"` +
                (isCurrent ? ` aria-current="page"` : "") +
                `>${copy[v]}</button>`
              );
            })
            .join("");
          const screen = statusView
            ? `<section class="screen"><h1 class="screen-title visually-hidden">${copy.status}</h1>` +
              panels(["", "", "", ""].map(() => "")) +
              `</section>`
            : `<section class="screen"><h1 class="screen-title visually-hidden">${copy.settings}</h1>` +
              `<section class="stack settings-group"><h2>${copy.preferences}</h2>${panels(copy.panels)}</section>` +
              `<section class="stack settings-group"><h2>${copy.explanations}</h2>${panels(copy.explanationPanels)}</section>` +
              `</section>`;
          return (
            `<div class="settings-section"><nav aria-label="${copy.switcherLabel}" class="settings-status-switcher">` +
            `${switcher}</nav>${screen}</div>`
          );
        }
        const title = copy[selected];
        return (
          `<section class="screen"><h1 class="screen-title">${title}</h1>` +
          panels(["", "", "", "", "", ""]) +
          `</section>`
        );
      }

      /** Publishes both sticky heights exactly as SettingsSection.tsx does. */
      function publishStickyHeights() {
        const header = document.querySelector(".app-header--sticky");
        const switcher = document.querySelector(".settings-status-switcher");
        const publish = () => {
          root.style.setProperty(
            "--app-header-block-size",
            `${header ? header.getBoundingClientRect().height : 0}px`,
          );
          root.style.setProperty(
            "--settings-switcher-block-size",
            `${switcher ? switcher.getBoundingClientRect().height : 0}px`,
          );
        };
        publish();
        const observer = new ResizeObserver(publish);
        if (header) observer.observe(header);
        if (switcher) observer.observe(switcher);
      }

      function renderApp(dir) {
        root.lang = copy.htmlLang;
        if (params.get("text") === "200") root.style.fontSize = "200%";
        const inset = Number(params.get("inset") ?? "0");
        root.style.setProperty("--safe-area-inset-top", `${inset}px`);
        const statusBar =
          view === "context" && inset > 0 ? `<div class="mock-status-bar"></div>` : "";
        document.getElementById("mockup").innerHTML =
          `${statusBar}<div class="app-shell"><header class="app-header--sticky">${navigation(dir)}</header>` +
          `${content()}</div>`;
        publishStickyHeights();
        const scroll = Number(params.get("scroll") ?? "0");
        if (scroll > 0) window.scrollTo(0, scroll);
      }

      function renderSpecimen(dir) {
        root.lang = copy.htmlLang;
        const row = (sizePx, isSelected, caption) =>
          `<div class="specimen-row"><span class="specimen-caption">${caption}</span>` +
          DESTINATIONS.map(
            (destination) =>
              `<div class="specimen-tile${isSelected ? " is-selected" : ""}" ` +
              `style="width:${sizePx + 22}px;height:${sizePx + 22}px">${svg(dir, destination, isSelected, sizePx)}</div>`,
          ).join("") +
          `</div>`;
        document.getElementById("mockup").innerHTML =
          `<div class="specimen" data-dir="${dir}">` +
          row(22, false, "22 px") +
          row(22, true, "22 px, selected") +
          row(66, false, "66 px") +
          row(66, true, "66 px, selected") +
          `</div>`;
      }

      function renderIndex() {
        const width = params.get("width") === "320" ? 320 : 390;
        const text = params.get("text") === "200" ? "200" : "100";
        const base = location.pathname;
        const cells = Object.keys(DIRECTIONS)
          .map((dir) => {
            const frames = DESTINATIONS.map((destination) => {
              const query = `?dir=${dir}&selected=${destination}&lang=${lang}&text=${text}`;
              const height = text === "200" ? 200 : destination === "settings" ? 130 : 80;
              return `<iframe title="${DIRECTIONS[dir].name}, ${destination}" src="${base}${query}" width="${width}" height="${height}"></iframe>`;
            }).join("");
            return `<h2>${DIRECTIONS[dir].name}</h2><div class="index-row">${frames}</div>`;
          })
          .join("");
        const links = [390, 320]
          .flatMap((w) =>
            ["en", "de"].flatMap((l) =>
              ["100", "200"].map(
                (t) =>
                  `<a href="?width=${w}&lang=${l}&text=${t}">${w} px · ${l.toUpperCase()} · ${t}%</a>`,
              ),
            ),
          )
          .join(" · ");
        document.getElementById("mockup").innerHTML =
          `<div class="index"><h1 class="screen-title">Item 102 — navigation symbol mock-ups</h1>` +
          `<p>${links}</p>${cells}</div>`;
      }

      if (!dirKey || !(dirKey in DIRECTIONS)) renderIndex();
      else if (view === "specimen") renderSpecimen(dirKey);
      else renderApp(dirKey);
    </script>
  </body>
</html>
